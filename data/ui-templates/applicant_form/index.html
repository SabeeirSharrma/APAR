<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Apply Now</h1>
        <p class="subtitle">Submit your application and we'll get back to you soon.</p>
      </div>
      <form id="apply-form">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="position">Position *</label>
          <select id="position" name="positionId" required>
            <option value="">Select a position...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="resume">Resume (PDF, DOC, DOCX) *</label>
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" hidden>
            <div class="upload-text">Drag & drop your resume here or <span class="upload-link">browse</span></div>
            <div class="upload-filename" id="upload-filename"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="info">Additional Information (optional)</label>
          <textarea id="info" name="supplementaryInfo" rows="3" placeholder="Anything else you'd like us to know..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Submit Application</button>
      </form>
      <div id="success-message" class="success-message" style="display:none;">
        <h2>Application Submitted!</h2>
        <p>Thank you for applying. You'll receive a confirmation email shortly.</p>
        <p class="app-id" id="app-id-display"></p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
